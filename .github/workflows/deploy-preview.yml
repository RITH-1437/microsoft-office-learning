# Preview deployment to Vercel for pull requests from this repository.
# - Skips cleanly (with a summary) when Vercel secrets are not configured, so the
#   workflow never fails just because deployment is not set up.
# - Uses `pull_request` (not pull_request_target) and requires the PR head to live in
#   this repository, so untrusted fork code never runs with deployment credentials.
# - If the Vercel GitHub integration is connected, do NOT add these secrets: Vercel
#   already creates previews and this workflow stays skipped.
name: Deploy preview (Vercel)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Vercel preview
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check deployment credentials
        id: creds
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ⏭️ Preview deployment skipped"
              echo
              echo "Vercel secrets (\`VERCEL_TOKEN\`, \`VERCEL_ORG_ID\`, \`VERCEL_PROJECT_ID\`) are not configured."
              echo "See docs/ci-cd-setup.md. If the Vercel GitHub integration is connected, Vercel posts the preview URL on the PR itself."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.configured == 'true'

      - uses: actions/setup-node@v7
        if: steps.creds.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.creds.outputs.configured == 'true'
        run: npm ci

      - name: Install Vercel CLI
        if: steps.creds.outputs.configured == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings (preview)
        if: steps.creds.outputs.configured == 'true'
        run: vercel pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build (local, same toolchain as CI)
        if: steps.creds.outputs.configured == 'true'
        run: vercel build --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy prebuilt output
        if: steps.creds.outputs.configured == 'true'
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### 🔍 Preview deployed"
            echo
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"
